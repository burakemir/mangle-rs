// MangleService: the RPC interface of mangle-server.
//
// See crates/mangle-server/RPC_DESIGN.md for the full design rationale.
syntax = "proto3";

package mangle;

import "mangle/value.proto";

service MangleService {
  // Query a loaded program; results stream in FactBatch chunks.
  rpc Query(QueryRequest) returns (stream QueryEvent);
  // Stateless: compile + run the given source, stream results.
  rpc Eval(EvalRequest) returns (stream QueryEvent);

  // Insert facts into a program's EDB. Stream single Facts or FactBatches.
  rpc InsertFacts(stream MutationRequest) returns (MutationSummary);
  // Retract facts from a program's EDB.
  rpc RetractFacts(stream MutationRequest) returns (MutationSummary);

  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse);
  rpc LoadProgram(LoadProgramRequest) returns (ProgramInfo);
  rpc GetProgram(GetProgramRequest) returns (ProgramInfo);
  rpc DeleteProgram(DeleteProgramRequest) returns (Empty);
  rpc ReloadProgram(ReloadProgramRequest) returns (ProgramInfo);
  rpc ReloadAll(ReloadAllRequest) returns (ListProgramsResponse);

  // --- Cluster administration (replicated mode) -------------------------

  // Ask a cluster member to add the caller as a learner and promote it
  // to voter. Leader-only.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Remove a node from the cluster. Leader-only.
  rpc RemoveNode(RemoveNodeRequest) returns (Empty);
  // Node/cluster status: id, leadership, term, indexes, membership.
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
}

message Empty {}

message QueryRequest {
  string program = 1;

  oneof query {
    // Textual form (same grammar as the CLI), parsed server-side.
    string text = 2;
    // Structured form, no parsing involved.
    StructuredQuery structured = 3;
  }

  // Encoding of result facts in the stream.
  ResultEncoding encoding = 4;
  // Target number of facts per streamed FactBatch (server may deviate).
  uint32 batch_size = 5;
  // Hard limit on number of result facts; 0 = unlimited.
  uint64 limit = 6;
  // Read consistency (replicated mode only; NONE outside it).
  ConsistencyLevel consistency = 7;
}

enum ResultEncoding {
  ROWS = 0;
  COLUMNAR = 1;
}

// Read consistency levels (DISTRIBUTED_PLAN.md §3.7). NONE is the default.
enum ConsistencyLevel {
  // Any node answers from its local applied state (eventually consistent).
  NONE = 0;
  // The leader answers from its local applied state; followers reject.
  WEAK = 1;
  // The read observes everything committed before it: the server proposes
  // a no-op through Raft and serves locally once it is applied.
  STRONG = 2;
}

message StructuredQuery {
  string predicate = 1;
  // One entry per column position. Absent trailing entries = wildcard.
  repeated ArgPattern args = 2;
}

message ArgPattern {
  oneof pattern {
    // Unbound: matches anything (a Mangle variable / `_`).
    Wildcard any = 1;
    // Ground constant at this position.
    Value const = 2;
  }
}

message Wildcard {}

message EvalRequest {
  string source = 1;
  // Additional source units (libs) compiled together with `source`.
  repeated string libs = 2;
  // Optional query; empty means "all relations".
  string query = 3;
  ResultEncoding encoding = 4;
  uint32 batch_size = 5;
  uint64 limit = 6;
}

// One streamed event of Query / Eval.
message QueryEvent {
  oneof event {
    FactBatch batch = 1;
    QueryStats done = 2;
  }
}

message QueryStats {
  uint64 num_facts = 1;
  // Wall time of query evaluation, microseconds.
  uint64 elapsed_us = 2;
  // Names of the variables bound by the query, in column order.
  repeated string variables = 3;
}

message MutationRequest {
  string program = 1;
  oneof payload {
    Fact fact = 2;
    FactBatch batch = 3;
  }
}

message MutationSummary {
  uint64 num_inserted = 1;
  uint64 num_retracted = 2;
  uint64 num_skipped = 3;
}

message ProgramInfo {
  string name = 1;
  repeated string predicates = 2;
  // Only populated by GetProgram.
  string source = 3;
}

message LoadProgramRequest {
  string name = 1;
  string source = 2;
}

message GetProgramRequest {
  string name = 1;
}

message DeleteProgramRequest {
  string name = 1;
}

message ReloadProgramRequest {
  string name = 1;
}

message ListProgramsRequest {}

message ReloadAllRequest {}

message ListProgramsResponse {
  repeated ProgramInfo programs = 1;
}

// --- Cluster administration -------------------------------------------

message JoinRequest {
  // The caller's stable node id.
  uint64 node_id = 1;
  // The address other nodes use to reach the caller (advertise address).
  string addr = 2;
  // The caller's mangle-server version; the leader rejects mismatches
  // (mixed-version clusters are unsupported, plan §7.5).
  string version = 3;
}

message JoinResponse {
  // The leader's node id (useful as a client hint).
  uint64 leader_id = 1;
}

message RemoveNodeRequest {
  uint64 node_id = 1;
}

message NodeStatusRequest {}

message MemberInfo {
  uint64 node_id = 1;
  string addr = 2;
  bool is_voter = 3;
  bool is_leader = 4;
}

message NodeStatusResponse {
  uint64 node_id = 1;
  // Present iff this node is in replicated mode.
  bool raft_enabled = 2;
  uint64 term = 3;
  // The node this node believes is the leader; 0 = unknown.
  uint64 leader_id = 4;
  uint64 last_applied_index = 5;
  uint64 last_log_index = 6;
  repeated MemberInfo members = 7;
  string version = 8;
  // Per-program (program source hash, external-EDB fingerprint), both
  // hex-encoded; an empty EDB fingerprint means "no external sources / no
  // fingerprint". Compare across nodes to detect external-EDB divergence
  // (plan §4.4).
  map<string, ProgramFingerprint> fingerprints = 9;
}

message ProgramFingerprint {
  // SHA-256 of the program source, hex.
  string program_hash = 1;
  // Combined fingerprint of the program's external EDB sources, hex;
  // empty when there are none or a source cannot be fingerprinted.
  string edb_fingerprint = 2;
}
