[package]
name = "mangle-proto"
version.workspace = true
edition.workspace = true
description = "Protobuf/Connect RPC interface for Mangle: canonical value encoding and MangleService"
documentation.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
mangle-common = { workspace = true, features = ["edge"] }
connectrpc = "0.9"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true

[build-dependencies]
connectrpc-build = "0.9"
protoc-bin-vendored = "3"
